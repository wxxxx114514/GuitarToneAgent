[project]
name = "guitar-tone-agent"
version = "0.1.0"
description = "电吉他效果器调音 Agent —— 闭环测音色（参考曲 -> 目标曲线 -> 改预设 -> reamp 测量 -> 解 EQ）"
requires-python = ">=3.13,<3.14"
# 版本按现有 venv 实测冻结；要改版本，先跑一遍全流程再改
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "audio-separator==0.47.0",
    "onnxruntime==1.30.0",
    "onnx-weekly==1.24.0.dev20260921",
    "onnx2torch-py313==1.6.0",
    "diffq-fixed==0.2.4",
    "rotary-embedding-torch==0.6.5",
    "beartype==0.18.5",
    "einops==0.8.2",
    "julius==0.2.8",
    "ml_collections==1.1.0",
    "pydub==0.25.1",
    "resampy==0.4.3",
    "samplerate==0.1.0",
    "scikit-learn==1.9.1",
    "soxr==1.1.0",
    "pooch==1.9.0",
    "joblib==1.6.0",
    "Cython==3.3.0",
    "pillow==12.3.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "audioread==3.1.0",
    "audioop-lts==0.2.2",
    "standard-aifc==3.13.0",
    "standard-chunk==3.13.0",
    "standard-sunau==3.13.0",
    "sympy==1.14.0",
    "networkx==3.6.1",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "mpmath==1.3.0",
    "typing_extensions==4.16.0",
    "absl-py==2.5.0",
    "protobuf==7.36.2",
    "flatbuffers==25.12.19",
    "packaging==26.3",
    "platformdirs==4.12.0",
    "decorator==5.3.1",
    "lazy-loader==0.6",
    "msgpack==1.2.2",
    "narwhals==2.26.0",
    "threadpoolctl==3.7.0",
    "cloudpickle==3.1.2",
    "six==1.17.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "idna==3.20",
    "urllib3==2.8.0",
    "cffi==2.1.1",
    "pycparser==3.0",
    "ml_dtypes==0.6.0",
    "colorama==0.4.6",
]

[tool.uv]
# 只解析 Windows 环境：本项目依赖 torch+CUDA、samplerate 等平台相关轮子
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

# 默认源
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# CUDA 版 torch 的官方源。explicit=true 很关键：
# 不加它，uv 会把 PyTorch 源当成所有包的候选，certifi 之类会被它截胡（实测报 unsatisfiable）。
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
